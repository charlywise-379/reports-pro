<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Omni Reports · {{companyName}} · Reporte #{{edition}} · {{year}}</title>
<style>
/*__FONTS__*/
/*__STYLES__*/
</style>
</head>
<body class="{{bodyClass}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></symbol>
  <symbol id="i-trend-up" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="i-trend-down" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8M15 17h6v-6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>
<!--__PAGES__-->
<script>
/* Ajuste automático: si el contenido de una página no cabe, se reduce de forma proporcional
   (pasos de 0.02, piso 0.78) en lugar de recortarse; cuenta el desborde vertical y el horizontal. Deja data-z en cada .fit, data-overflow="1"
   si aun en el piso no cabe, y body[data-fit="done"] al terminar. */
(function () {
  var FLOOR = 0.78, STEP = 0.02;
  function overflows(fit) { return fit.scrollHeight > fit.clientHeight + 1 || fit.scrollWidth > fit.clientWidth + 1; }
  function fitOne(fit) {
    var z = 1;
    fit.style.setProperty('--z', '1');
    while (overflows(fit) && z > FLOOR) {
      z = Math.max(FLOOR, Math.round((z - STEP) * 100) / 100);
      fit.style.setProperty('--z', String(z));
    }
    fit.dataset.z = String(z);
    if (overflows(fit)) fit.dataset.overflow = '1'; else delete fit.dataset.overflow;
  }
  function fitAll() {
    var fits = document.querySelectorAll('.page .fit');
    for (var i = 0; i < fits.length; i++) fitOne(fits[i]);
    document.body.dataset.fit = 'done';
  }

  /* Pre-desenfoque del teaser (plan gratuito). El filtro CSS blur() hace que Chromium rasterice cada pagina a 300 ppi
     sin perdida (~1.5 MB por pagina). Aqui las paginas 6+ (las mismas de la regla body.is-teaser .page:nth-of-type(n+6))
     se desenfocan en un canvas pequeno, se guardan como JPEG y reemplazan al contenido vivo por un <img>. La capa
     .teaser-overlay es hermana de .page-content y queda nitida. Protocolo: body[data-blur] = skipped (sin teaser) |
     pending | done | failed. Si falla, se deja la regla CSS de desenfoque como respaldo (no se retira).
     Limite conocido: los iconos <use href="#i-..."> no se dibujan dentro del foreignObject; es aceptable porque la pagina
     queda desenfocada. */
  var BLUR_FIRST_INDEX = 5, SCALE = 0.5, JPEG_QUALITY = 0.6, BLUR_PX = 4, LOAD_TIMEOUT_MS = 8000;
  var DARK_BG = '#0B0D14', LIGHT_BG = '#F6F7FA';
  var blurStarted = false;

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var timer = setTimeout(function () { reject(new Error('timeout al cargar el SVG')); }, LOAD_TIMEOUT_MS);
      img.onload = function () { clearTimeout(timer); resolve(img); };
      img.onerror = function () { clearTimeout(timer); reject(new Error('fallo al cargar el SVG')); };
      img.src = src;
    });
  }
  function pageCss() {
    var css = Array.prototype.map.call(document.querySelectorAll('style'), function (s) { return s.textContent; }).join('\n');
    return css.replace(/body\.is-teaser[^{]*\{[^}]*\}/g, '').replace(/\]\]>/g, ']]]]><![CDATA[>');
  }
  function blurPage(page, css, skin) {
    var content = page.querySelector('.page-content');
    if (!content) return Promise.reject(new Error('pagina sin .page-content'));
    var w = page.clientWidth, h = page.clientHeight;
    var dark = page.classList.contains('page--dark');
    var inner = new XMLSerializer().serializeToString(content);
    var size = 'width:' + w + 'px;height:' + h + 'px';
    var xhtml = '<div xmlns="http://www.w3.org/1999/xhtml" class="' + skin + '" style="' + size + '"><style><![CDATA[' + css + ']]></style>' +
      '<div class="page' + (dark ? ' page--dark' : '') + '" style="' + size + ';position:relative;overflow:hidden">' + inner + '</div></div>';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '"><foreignObject width="100%" height="100%">' + xhtml + '</foreignObject></svg>';
    return loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)).then(function (img) {
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * SCALE); canvas.height = Math.round(h * SCALE);
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = dark ? DARK_BG : LIGHT_BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.filter = 'blur(' + BLUR_PX + 'px)';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var out = document.createElement('img');
      out.src = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
      out.alt = '';
      out.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
      content.style.filter = 'none';
      content.replaceChildren(out);
      page.setAttribute('data-prebl', '1');
    });
  }
  function preBlur() {
    if (!document.body.classList.contains('is-teaser')) { document.body.dataset.blur = 'skipped'; return; }
    document.body.dataset.blur = 'pending';
    var css = pageCss();
    var skin = (document.body.className.match(/skin-\S+/) || [''])[0];
    var pages = Array.prototype.slice.call(document.querySelectorAll('.page'), BLUR_FIRST_INDEX)
      .filter(function (p) { return !p.hasAttribute('data-prebl'); });
    var chain = Promise.resolve();
    pages.forEach(function (p) { chain = chain.then(function () { return blurPage(p, css, skin); }); });
    chain.then(function () { document.body.dataset.blur = 'done'; },
      function () { document.body.dataset.blur = 'failed'; });
  }
  var fontsReady = !(document.fonts && document.fonts.ready);
  function run() { fitAll(); maybeBlur(); }
  function maybeBlur() {
    if (!document.body.classList.contains('is-teaser')) { document.body.dataset.blur = 'skipped'; return; }
    if (blurStarted || document.body.dataset.fit !== 'done' || !fontsReady || document.readyState !== 'complete') return;
    blurStarted = true;
    try { preBlur(); } catch (e) { document.body.dataset.blur = 'failed'; }
  }
  /* El pre-desenfoque corre despues del ajuste, con fuentes y pagina cargadas (una sola vez). */
  function onFonts() { fontsReady = true; run(); }
  if (!fontsReady) document.fonts.ready.then(onFonts); else run();
  window.addEventListener('load', run);
})();
</script>
</body>
</html>

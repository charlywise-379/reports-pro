<div class="g2 risks-grid">
  <div class="stack lst">{{#each highRisks}}<div class="card card--accent tone-{{this.tone}}"><div class="risk-head"><div class="ring"><svg width="56" height="56" viewBox="0 0 56 56"><circle class="trk" cx="28" cy="28" r="24" fill="none" stroke-width="5"/><circle class="val" cx="28" cy="28" r="24" fill="none" stroke-width="5" stroke-dasharray="{{this.impactDash}} {{this.impactGap}}"/></svg><div class="ring-v"><span class="mono sm">{{this.probability}}%</span></div></div><div><b>{{this.title}}</b></div></div><p>{{this.description}}</p><div class="act"><svg class="ic"><use href="#i-shield"/></svg><span>{{this.mitigation}}</span></div></div>{{/each}}</div>
  <div class="card"><div class="label">Riesgos medios · {{mediumRisksCount}}</div><div class="mini-list lst">{{#each mediumRisks}}<div class="mini tone-warn"><span class="dot mt"></span><div><b>{{this.title}}</b><p class="muted">{{this.description}}</p></div></div>{{/each}}</div></div>
</div>

<div class="g2 risks-grid">
  <div class="stack">
    <div class="label tone-bad tone-text">Riesgos de alto impacto — mitigación urgente</div>
    <div class="stack lst">{{#each highRisks}}<div class="card card--accent hot tone-{{this.tone}}"><div class="risk-row"><div class="grow"><div class="risk-head"><b>{{this.title}}</b><span class="chip">Prob. {{this.probability}}%</span></div><p>{{this.description}}</p><div class="act"><svg class="ic"><use href="#i-shield"/></svg><span>{{this.mitigation}}</span></div></div><div class="risk-impact"><div class="label">Impacto</div><div class="ring"><svg width="44" height="44" viewBox="0 0 56 56"><circle class="trk" cx="28" cy="28" r="24" fill="none" stroke-width="5"/><circle class="val" cx="28" cy="28" r="24" fill="none" stroke-width="5" stroke-dasharray="{{this.impactRingDash}} 151"/></svg><div class="ring-v"><span class="mono">{{this.impact}}</span></div></div><div class="sm muted">de 10</div></div></div></div>{{/each}}</div>
  </div>
  <div class="card"><div class="label tone-warn tone-text">Riesgos medios — monitoreo activo</div><div class="mini-list lst">{{#each mediumRisks}}<div class="mini tone-warn"><span class="dot mt"></span><div><b>{{this.title}}</b><p class="muted">{{this.description}}</p></div></div>{{/each}}</div></div>
</div>

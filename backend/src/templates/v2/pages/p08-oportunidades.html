<div class="g4 opps lst">{{#each opportunities}}<div class="card card--accent tone-{{this.tone}}"><div class="rowline"><span class="chip">{{this.type}}</span><span class="mono sm tone-text">Score: {{this.score}}</span></div><div class="bar opp-score"><i style="width:{{this.scorePct}}%"></i></div><b class="opp-title">{{this.title}}</b><p class="muted">{{this.description}}</p><div class="opp-foot"><span class="mono sm muted"><svg class="ic"><use href="#i-clock"/></svg> Ventana: {{this.window}}</span><span class="chip tone-{{this.actionTone}}">{{this.actionLabel}}</span></div></div>{{/each}}</div>
<div class="card"><div class="label">Debilidades visibles de competidores — explotar ahora</div><div class="g3 lst">{{#each rivalWeaknesses}}<div class="mini"><span class="dot dot--accent mt"></span><div><b>{{this.competitor}}</b><p class="muted">{{this.weakness}}</p></div></div>{{/each}}</div></div>

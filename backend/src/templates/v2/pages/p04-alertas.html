<div class="g2 alerts">
  <div class="stack">
    <div class="label tone-bad tone-text">Alertas críticas — acción inmediata</div>
    <div class="stack lst">{{#each criticalAlerts}}<div class="card card--accent hot tone-bad"><div class="a-head"><svg class="ic tone-text"><use href="#i-alert"/></svg><div class="grow"><b>{{this.title}}</b><div class="sm muted">{{this.detected}}</div></div><span class="chip">Crítico</span></div><p>{{this.description}}</p><div class="act"><svg class="ic"><use href="#i-spark"/></svg><span>{{this.action}}</span></div></div>{{/each}}</div>
  </div>
  <div class="stack">
    <div class="label tone-warn tone-text">Señales en vigilancia — monitoreo activo</div>
    <div class="stack lst">{{#each mediumAlerts}}<div class="card tone-warn"><div class="a-head"><span class="dot mt"></span><div class="grow"><b>{{this.title}}</b><div class="sm muted">{{this.source}}</div></div><span class="chip">Media</span></div><p>{{this.description}}</p></div>{{/each}}</div>
  </div>
</div>

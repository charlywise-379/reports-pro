[phases.setup]
nixPkgs = ["nodejs_20", "nss", "nspr", "atk", "cups", "libdrm", "dbus", "libxkbcommon", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "mesa", "expat", "xorg.libxcb", "pango", "cairo", "alsa-lib"]

[phases.install]
cmds = ["npm install -g pnpm && pnpm install"]

[phases.build]
cmds = ["pnpm prisma generate && pnpm build"]

[start]
cmd = "pnpm start"
